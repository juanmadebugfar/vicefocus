<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Volviendo a Mission Control</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #0b0d12; color: #e8e6f0; }
  main { max-width: 32rem; padding: 1.5rem; }
  a { color: #3be0d0; }
</style>
</head>
<body>
<main>
  <h1>Volviendo a Mission Control…</h1>
  <p>Esta página solo pasa la autorización de TikTok a la aplicación que corre en tu propia computadora. No guarda nada.</p>
  <p id="manual" hidden>Si no avanzás solo, <a id="go" href="#">tocá acá</a>.</p>
</main>
<script>
  // Puente: TikTok solo acepta direcciones https públicas; la app real escucha en esta misma PC.
  var target = "http://localhost:8765/api/connect/tiktok/callback" + location.search;
  document.getElementById("go").href = target;
  document.getElementById("manual").hidden = false;
  location.replace(target);
</script>
</body>
</html>
